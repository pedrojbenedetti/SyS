name: Update README index

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/scripts/update_readme_toc.py
      - .github/workflows/update-readme-toc.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-toc:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update README index
        run: python .github/scripts/update_readme_toc.py

      - name: Commit changes if needed
        run: |
          if git diff --quiet -- README.md; then
            echo "README index is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README index"
          git push
